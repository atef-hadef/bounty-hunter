name: Bounty Hunt

on:
  schedule:
    # Toutes les 30 min. Dépôt privé : ~1 min facturée par passage,
    # soit ~1 440 min/mois sur les 2 000 gratuites. Dépôt public : illimité.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test : afficher les résultats dans le log sans notifier"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: bounty-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Hunt bounties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          MIN_AMOUNT: ${{ vars.MIN_AMOUNT }}
          MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS }}
          REQUIRE_PAYER_HISTORY: ${{ vars.REQUIRE_PAYER_HISTORY }}
          EXCLUDED_REPOS: ${{ vars.EXCLUDED_REPOS }}
          MIN_STARS: ${{ vars.MIN_STARS }}
          MAX_STARS: ${{ vars.MAX_STARS }}
          MAX_COMMENTS: ${{ vars.MAX_COMMENTS }}
          MAX_PUSH_DAYS: ${{ vars.MAX_PUSH_DAYS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python hunter.py

      - name: Hunt startup jobs
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_JOBS_WEBHOOK_URL: ${{ secrets.DISCORD_JOBS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS }}
          JOB_REQUIRE: ${{ vars.JOB_REQUIRE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python jobs.py

      - name: Hunt startup issues (hiring path)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STARTUPS_WEBHOOK_URL: ${{ secrets.DISCORD_STARTUPS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          MIN_BATCH_YEAR: ${{ vars.MIN_BATCH_YEAR }}
          MAX_TEAM_SIZE: ${{ vars.MAX_TEAM_SIZE }}
          REQUIRE_HIRING: ${{ vars.REQUIRE_HIRING }}
          ISSUE_MAX_AGE_HOURS: ${{ vars.ISSUE_MAX_AGE_HOURS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python startups.py

      - name: Commit state files if changed
        run: |
          FILES="seen_issues.json seen_jobs.json seen_startup_issues.json targets.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: update state files [skip ci]"
          git pull --rebase
          git push
