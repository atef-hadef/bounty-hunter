name: Bounty Hunt

on:
  schedule:
    # Passage complet toutes les heures : ~2 min facturées x 24 x 30 = ~1 440 min/mois,
    # sous les 2 000 gratuites d'un dépôt privé.
    - cron: '7 * * * *'
    # Passages rapides (issues startup seulement) toutes les 15 min, uniquement si la
    # variable FAST_SCHEDULE vaut 1. À activer seulement si le dépôt est public
    # (minutes illimitées), sinon le quota gratuit serait dépassé.
    - cron: '22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test : afficher les résultats dans le log sans notifier"
        type: boolean
        default: false
      mode:
        # « auto » sert au déclencheur externe (cron-job.org, toutes les 15 min) :
        # passage complet dans le premier quart d'heure, issues startup seulement sinon.
        description: "full = tout, fast = issues startup seulement, auto = selon l'heure"
        type: choice
        options: [full, fast, auto]
        default: full

permissions:
  contents: write

concurrency:
  group: bounty-hunt
  cancel-in-progress: false

env:
  FAST_CRON: '22,37,52 * * * *'

jobs:
  hunt:
    # Un passage rapide ignoré ne coûte aucune minute.
    if: github.event.schedule != '22,37,52 * * * *' || vars.FAST_SCHEDULE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose run type
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          fast=false
          [ "$SCHEDULE" = "$FAST_CRON" ] && fast=true
          [ "$MODE" = "fast" ] && fast=true
          [ "$MODE" = "auto" ] && [ $((10#$(date -u +%M))) -ge 15 ] && fast=true
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "Passage rapide (issues startup seulement) : $fast"

      # Chaque flux est indépendant : si l'un plante, les autres tournent quand même
      # et le salon #statut reçoit une alerte.
      - name: Hunt bounties
        id: bounties
        if: steps.plan.outputs.fast != 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          MIN_AMOUNT: ${{ vars.MIN_AMOUNT }}
          MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS }}
          REQUIRE_PAYER_HISTORY: ${{ vars.REQUIRE_PAYER_HISTORY }}
          EXCLUDED_REPOS: ${{ vars.EXCLUDED_REPOS }}
          MIN_STARS: ${{ vars.MIN_STARS }}
          MAX_STARS: ${{ vars.MAX_STARS }}
          MAX_COMMENTS: ${{ vars.MAX_COMMENTS }}
          MAX_PUSH_DAYS: ${{ vars.MAX_PUSH_DAYS }}
          BOUNTY_DAILY: ${{ vars.BOUNTY_DAILY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python hunter.py

      - name: Hunt startup jobs
        id: jobs
        if: steps.plan.outputs.fast != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          DISCORD_JOBS_WEBHOOK_URL: ${{ secrets.DISCORD_JOBS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS }}
          JOB_REQUIRE: ${{ vars.JOB_REQUIRE }}
          JOB_OPEN_ONLY: ${{ vars.JOB_OPEN_ONLY }}
          JOBS_DAILY: ${{ vars.JOBS_DAILY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python jobs.py

      - name: Hunt startup issues (hiring path)
        id: startups
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_STARTUPS_WEBHOOK_URL: ${{ secrets.DISCORD_STARTUPS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          MIN_BATCH_YEAR: ${{ vars.MIN_BATCH_YEAR }}
          MAX_TEAM_SIZE: ${{ vars.MAX_TEAM_SIZE }}
          REQUIRE_HIRING: ${{ vars.REQUIRE_HIRING }}
          ISSUE_MAX_AGE_HOURS: ${{ vars.ISSUE_MAX_AGE_HOURS }}
          STARTUP_DAILY: ${{ vars.STARTUP_DAILY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python startups.py

      - name: Health report (#statut)
        if: always()
        continue-on-error: true
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_HOUR_UTC: ${{ vars.STATUS_HOUR_UTC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: >
          python status.py
          --outcomes "bounties=${{ steps.bounties.outcome }},jobs=${{ steps.jobs.outcome }},startups=${{ steps.startups.outcome }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit state files if changed
        if: always()
        run: |
          FILES="seen_issues.json seen_jobs.json seen_startup_issues.json targets.json daily_quota.json status_state.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: update state files [skip ci]"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push refusé, nouvel essai ($i)…"
            sleep 5
          done
          exit 1

      # Rend l'exécution rouge dans l'onglet Actions (et GitHub t'envoie un email)
      # quand un flux a planté, après avoir quand même sauvegardé l'état.
      - name: Fail if a feed failed
        if: steps.bounties.outcome == 'failure' || steps.jobs.outcome == 'failure' || steps.startups.outcome == 'failure'
        run: |
          echo "Au moins un flux a échoué : voir les étapes ci-dessus."
          exit 1
